<main class="contenedor-mapa">
  <header class="cabecera-mapa">
    <h2>Ruta del Arquitecto</h2>
    <div class="fuego-progreso">🔥 Mi Progreso</div>
  </header>

  <section class="ruta-vertical">
    <!-- El bucle que dibuja cada nivel -->
    @for (nivel of niveles; track nivel.id; let esElUltimo = $last) {
      <article class="casilla-nivel" [class.bloqueado]="nivel.estado === 'BLOQUEADO'">
        <!-- 1. El Cartel Blanco Superior -->
        <div class="cartel-titulo">
          <h3>{{ nivel.titulo }}</h3>
          <span class="estado-texto">{{ nivel.estado }}</span>
        </div>

        <!-- 2. El Botón Circular 3D -->
        <button
          class="boton-3d"
          [class.completado]="nivel.estado === 'COMPLETADO'"
          [class.activo]="nivel.estado === 'ACTIVO'"
          (click)="entrarAlNivel(nivel)"
        >
          <span class="icono-gigante">{{ nivel.icono }}</span>
        </button>

        <!-- 3. El Puente Conector (Se oculta en el último nivel) -->
        @if (!esElUltimo) {
          <div class="puente" [class.puente-dorado]="nivel.estado === 'COMPLETADO'"></div>
        }
      </article>
    }
  </section>
</main>
